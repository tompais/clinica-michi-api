# CI: corre en cada push. Revisa lint, tipos y código sin usar, corre los tests con cobertura y sube la imagen al registry de GitHub.
name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Los mismos chequeos que el pre-push de Husky. biome ci es biome check pensado para el CI: no escribe nada.
      - run: bunx biome ci .
      - run: bun run typecheck
      - run: bun run knip

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Falla si la cobertura baja de 80%. El umbral está en vitest.config.ts.
      - run: bun run test:coverage

  build-and-push:
    needs: [lint, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # La etiqueta de la imagen es el SHA del commit: esa es la que va a staging.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
      - name: Summary
        run: |
          echo "### 📦 Imagen subida al registry de GitHub" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA para previos: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Imagen: \`ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
