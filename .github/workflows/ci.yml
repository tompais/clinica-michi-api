# CI: corre en cada push. Revisa tipos, corre los tests y sube la imagen al registry de GitHub.
name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test

  build-and-push:
    needs: [lint, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # La etiqueta de la imagen es el SHA del commit: esa es la que va a staging.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
      - name: Summary
        run: |
          echo "### 📦 Imagen subida al registry de GitHub" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA para previos: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Imagen: \`ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
